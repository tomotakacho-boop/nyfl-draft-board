<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0d0b" />
    <meta name="description" content="Five-league fantasy football command center for standings, lineups, matchups, trades, rankings, and FAAB." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0d0b'/%3E%3Cpath d='M16 18h32v9H34v7h12v9H34v13H22V27h-6z' fill='%23dfff4f'/%3E%3C/svg%3E" />
    <title>Fantasy Control Room</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#command" aria-label="Fantasy Control Room home">
          <span class="brand-mark">F</span>
          <span><strong>Fantasy</strong><small>Control Room</small></span>
        </a>
        <nav id="primary-nav">
          <button class="nav-item is-active" data-view="command"><span>01</span>Command center</button>
          <button class="nav-item" data-view="teams"><span>02</span>My teams</button>
          <button class="nav-item" data-view="matchups"><span>03</span>Matchups</button>
          <button class="nav-item" data-view="players"><span>04</span>Player market</button>
          <button class="nav-item" data-view="trades"><span>05</span>Trade lab</button>
          <button class="nav-item" data-view="waivers"><span>06</span>Waivers + FAAB</button>
          <button class="nav-item" data-view="standings"><span>07</span>League tables</button>
          <button class="nav-item" data-view="snapshots"><span>08</span>Weekly snapshots</button>
        </nav>
        <div class="sidebar-foot">
          <span class="live-dot"></span>
          <div><strong id="sync-state">Loading data</strong><small id="sync-time">Checking sources…</small></div>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <button class="menu-button" id="menu-button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
          <div>
            <p class="eyebrow" id="page-kicker">2026 season · week —</p>
            <h1 id="page-title">Command center</h1>
          </div>
          <div class="topbar-actions">
            <label class="league-switcher">
              <span>League</span>
              <select id="global-league" aria-label="Choose league"></select>
            </label>
            <button class="icon-button" id="refresh-button" type="button" title="Reload the latest generated snapshot">↻</button>
          </div>
        </header>

        <section id="app" class="view" aria-live="polite">
          <div class="loading-grid">
            <div class="skeleton tall"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
