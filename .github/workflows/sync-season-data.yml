name: Sync season data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull ESPN and Sleeper data
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/sync_leagues.py
      - name: Commit changed snapshot
        run: |
          git config user.name "NYFL data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hub.json
          git diff --cached --quiet || git commit -m "Update season data"
          git push
